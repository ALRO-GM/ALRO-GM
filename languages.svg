<svg xmlns="http://www.w3.org/2000/svg" width="355" height="240" viewBox="0 0 355 240" role="img" aria-label="Most Used Languages">
<style>
  .t { font: 600 18px 'Segoe UI', Ubuntu, 'Helvetica Neue', sans-serif; fill: #0aa5a8; animation: fade .8s ease-out both; }
  .l { font: 400 14px 'Segoe UI', Ubuntu, 'Helvetica Neue', sans-serif; fill: #8b949e; }
  .v { font: 700 14px 'Segoe UI', Ubuntu, 'Helvetica Neue', sans-serif; fill: #e6edf3; }
  .row { opacity: 0; animation: fade .6s ease-out forwards; }
  .bar { transform-origin: left; transform: scaleX(0); animation: grow 1.1s cubic-bezier(.2,.8,.2,1) forwards; }
  @keyframes fade { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
  @keyframes grow { to { transform: scaleX(1); } }
</style>
<rect x=".5" y=".5" rx="10" width="354" height="239" fill="#0d1117" stroke="#1f2937"/>
<text x="25" y="38" class="t">Most Used Languages</text>
<g class="row" style="animation-delay:0.15s"><text x="25" y="66" class="l">TypeScript</text><text x="330" y="66" class="v" text-anchor="end">51.6%</text><rect x="25" y="72" width="305" height="6" rx="3" fill="#1f2937"/><rect class="bar" style="animation-delay:0.30s" x="25" y="72" width="157.4" height="6" rx="3" fill="#3178c6"/></g>
<g class="row" style="animation-delay:0.27s"><text x="25" y="94" class="l">Python</text><text x="330" y="94" class="v" text-anchor="end">36.3%</text><rect x="25" y="100" width="305" height="6" rx="3" fill="#1f2937"/><rect class="bar" style="animation-delay:0.42s" x="25" y="100" width="110.7" height="6" rx="3" fill="#3572A5"/></g>
<g class="row" style="animation-delay:0.39s"><text x="25" y="122" class="l">JavaScript</text><text x="330" y="122" class="v" text-anchor="end">7.9%</text><rect x="25" y="128" width="305" height="6" rx="3" fill="#1f2937"/><rect class="bar" style="animation-delay:0.54s" x="25" y="128" width="24.2" height="6" rx="3" fill="#f1e05a"/></g>
<g class="row" style="animation-delay:0.51s"><text x="25" y="150" class="l">CSS</text><text x="330" y="150" class="v" text-anchor="end">3.0%</text><rect x="25" y="156" width="305" height="6" rx="3" fill="#1f2937"/><rect class="bar" style="animation-delay:0.66s" x="25" y="156" width="9.1" height="6" rx="3" fill="#663399"/></g>
<g class="row" style="animation-delay:0.63s"><text x="25" y="178" class="l">HTML</text><text x="330" y="178" class="v" text-anchor="end">1.0%</text><rect x="25" y="184" width="305" height="6" rx="3" fill="#1f2937"/><rect class="bar" style="animation-delay:0.78s" x="25" y="184" width="3.0" height="6" rx="3" fill="#e34c26"/></g>
<g class="row" style="animation-delay:0.75s"><text x="25" y="206" class="l">Shell</text><text x="330" y="206" class="v" text-anchor="end">0.2%</text><rect x="25" y="212" width="305" height="6" rx="3" fill="#1f2937"/><rect class="bar" style="animation-delay:0.90s" x="25" y="212" width="2.0" height="6" rx="3" fill="#89e051"/></g>

</svg>